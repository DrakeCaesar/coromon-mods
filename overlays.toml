# overlays.toml - settings for overlays.py
#
# Edit this file, then run:   python overlays.py
#
# There are no command line options; everything comes from here. A run makes the game match
# this file - it tears down whatever was installed last time and installs what is enabled
# below - so setting `enabled` to false and running again is how you remove a feature.

# the process to attach to - it is waited for, so it need not be running
process = "coromon.exe"
# map the gamepad's triggers to the zoom keys (the triggers reach the game nowhere else -
# they are analogue and Solar2D emits no event for them)
gamepad_zoom = true
# how far a trigger must be pulled before it counts as pressed, in percent
gamepad_trigger_percent = 35
# how often a trigger that stays pulled repeats, so holding it keeps zooming
gamepad_repeat_ms = 220

[potential]
# install the battle Potential readout (screen overlay)
enabled = true

[items]
# install the item markers
enabled = true
# also mark item chests (itemChest / pyramidItemChest)
show_chests = true
# mark every item-carrying class (hidden items, chests, drill/gem spots, ground items, tree items)
show_all_items = true
# draw the item name above each marker
labels = true
# label font: "small" is outline_8, "big" is outline_10_bold   (one of: big, small)
font = "small"
# frames to keep re-reading the map after a location change; ends early once the marker set
# is stable
settle_frames = 30
# identical reads of the new map required before its markers are drawn; the game has
# already-collected objects spawned for the first frames
settle_stable_reads = 3

[squad]
# draw each squad Coromon's Potential under its level
enabled = true
# label font: "level" matches the level numbers, "small" is outline_8   (one of: level, small)
font = "level"
# extra pixels between the level number and the Potential under it
offset_y = 0
# line up with the level number: "left" starts under its L, "centre" balances on it   (one of: left, centre)
align = "left"
# colour the Potential by tier: white standard, green potent, gold perfect
tier_colours = true

[zoom]
# Consecutive still frames after a location change before the zoom comes
# back. The new map is not positioned in one frame, so the zoom is held off
# until the game stops moving it. 4 (the old hard-coded value) left the new
# location at the default zoom for ~4-8 frames; 1 is the first frame it stops.
# Raise to 2 if a location ever appears with the map offset.
settle_stable_frames = 4
settle_max_frames = 90
# install the overworld zoom
enabled = true
# install already zoomed out, to this many screen pixels per texture pixel; 0 is the game's own scale (no zoom)
pixels = 0
# keys that zoom out one stop
key_out = ["-", "minus", "["]
# keys that zoom in one stop
key_in = ["+", "=", "plus", "]"]
# keys that go back to the game's own scale
key_reset = ["0"]
# keep the game's own hitboxes out of the zoom: display:isColliding builds them from unscaled world-unit boxes, so without this the Mescher Realm dark souls, the dart traps and the Swurmy minigames reach 1/k further away when you zoom out
fix_collision_reach = true
# keep the visible-area circle on the player: the game offsets its mask by MTE.getConstrainedDistanceOfCamera, a world-unit distance spent as content pixels, so without this the hole drifts by (1-k) x clamped - which is zero mid-map and grows as you approach an edge
fix_light_circle = true
# one-shot repair: put the camera back on the player if an older build displaced it. Set it true, run once, then set it back to false.
recenter = false

[steptimer]
# show the Potentiflator / Traitformator step countdown
enabled = true
# which corner to put it in   (one of: top-left, top-right, bottom-left, bottom-right)
corner = "top-left"
# gap from the screen edge, in content units, horizontally
margin_x = 8
# gap from the screen edge, in content units, vertically
margin_y = 8
# distance between the two lines, in content units. Measured: the glyphs are 8 units tall, so the visible gap is spacing - 8, and 9 gives 5 px. Below 8.5 the lines overlap. Only worth changing if you want them further apart.
spacing = 9
# what a finished countdown reads, as in "Traitformator: ready"
ready_text = "ready"
# also show the Potentiflator result. The game decides it the moment the Coromon is handed over, so it reads out before the 1000 steps are walked - a roll you do not want then costs a reload instead of the whole walk
show_potential = true

[sprint]
# add a button that swaps the two running modes
enabled = true
# what swaps them. `buttonB` is the controller's B; `buttonA`, `button9` and friends are the
# others, and a keyboard key is named by the character it produces (`a`, `space`, `up`). Add more
# entries to have more than one; names are matched case-insensitively. Deliberately NOT the run
# button - that one is also interact, and it is meant to be held
key = ["buttonB"]
# start in mode 2 (run by default) rather than the game's own mode 1
start_running = false

[gold]
# show the real gold total instead of the game's 9,999,999 cap, in the top bar, the dialogs and
# the Rogue readout
enabled = true
# also correct the two top-bar labels, which clamp a second time where they draw and so ignore the
# uncapped getter. Turn this off to leave the game's counter untouched and only fix the dialogs
# and the Rogue readout
fix_counter = true
# thousands separator for the counter. "space" (the default, 17 597 722) won on sight over
# "apostrophe" (17'597'722). Also: "period", "comma", "none". Anything else is used literally -
# but it must be a character the font actually has: U+00A0 renders as an error glyph and makes the
# counter blink, because the text object stores something other than what was written. The
# grouping has to be drawn by us - the game formats its counter as %07d
separator = "space"
# hold the counter's gap after it at the size the game's layout intended, by moving the number AND
# the coin icon beside it left by however much the grouping widened the number. Moving only the
# number would clip into the coin, so both move and neither gap changes size. Off leaves both
# where the game put them and lets the gap after the number shrink
keep_right_edge = true
